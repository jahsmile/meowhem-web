<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>MEOWHEM: Pawnch Club</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* the canvas covers exactly the visible part of the screen (the browser's own bars excluded) */
  canvas#game { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; display: block; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #1a120d; z-index: 20; }
  #rotate svg { width: 120px; height: 120px; animation: turn 2.2s ease-in-out infinite; }
  @keyframes turn { 0%, 20% { transform: rotate(0deg); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
  /* phones and tablets held upright: the game is landscape */
  @media (orientation: portrait) { html.touch #rotate { display: flex; } }
  #fs { position: fixed; left: 6px; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(0,0,0,.45); display: none; z-index: 10; padding: 10px; }
  html.touch.can-fs:not(.fs) #fs { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f0d8b0;font:20px Arial">MEOWHEM…</div>
<div id="rotate" aria-label="Rotate your device">
  <svg viewBox="0 0 64 64" fill="none" stroke="#ffd040" stroke-width="4" stroke-linejoin="round"><rect x="20" y="6" width="24" height="44" rx="4"/><circle cx="32" cy="43" r="2" fill="#ffd040" stroke="none"/><path d="M50 30a18 18 0 0 1-8 16" stroke-linecap="round"/><path d="M38 44l4 2 1-5" stroke-linecap="round"/></svg>
</div>
<button id="fs" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<script>
  // Phones: the game asks for full screen (and landscape) on the first tap, so the browser's bars stop eating the
  // screen; a small button brings it back after the player leaves it. Where full screen does not exist (iPhone Safari),
  // "Add to Home Screen" opens the game without the bars (see the manifest).
  (function () {
    var root = document.documentElement;
    var touch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
    var inFrame = window.top !== window.self;
    var el = root, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (touch) root.classList.add("touch");
    if (touch && req && !inFrame) root.classList.add("can-fs");
    function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function sync() { root.classList.toggle("fs", isFs()); }
    function go() {
      if (!req || isFs() || inFrame) return;
      try {
        var p = req.call(el, { navigationUI: "hide" });
        var lock = function () { try { screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} };
        if (p && p.then) p.then(lock).catch(function () {}); else lock();
      } catch (e) {}
    }
    document.addEventListener("fullscreenchange", sync);
    document.addEventListener("webkitfullscreenchange", sync);
    if (touch) window.addEventListener("pointerup", function first() { window.removeEventListener("pointerup", first); go(); });
    document.getElementById("fs").addEventListener("click", function (e) { e.stopPropagation(); go(); });
  })();
</script>
<script src="./game.js"></script>
</body>
</html>
